services:
  - type: web
    name: credit-risk-predictor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
  - type: static
    name: credit-risk-frontend
    staticPublishPath: ./static
    autoDeploy: true
